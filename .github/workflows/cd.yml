# CD: on every merge to main. Runs CI first; deploys only if CI passed on this commit.
# Signs in to Azure as the group's managed identity (sdd-3a-g6-github) through OIDC:
# no Azure password is stored anywhere.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ vars.PREFIX }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      HAS_LLM_KEY: ${{ secrets.LLM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names (tagged with the commit SHA)
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "CONVERSATION_IMAGE=ghcr.io/$OWNER/nebula-conversation-api:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "INTELLIGENCE_IMAGE=ghcr.io/$OWNER/nebula-intelligence-api:$GITHUB_SHA" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Push Conversation API image
        uses: docker/build-push-action@v6
        with:
          context: services/conversation-api
          push: true
          provenance: false
          tags: ${{ env.CONVERSATION_IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
      - name: Push Intelligence API image
        uses: docker/build-push-action@v6
        with:
          context: services/intelligence-api
          push: true
          provenance: false
          tags: ${{ env.INTELLIGENCE_IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Optional LLM key (only if the LLM_API_KEY GitHub secret exists)
        if: env.HAS_LLM_KEY == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          az containerapp secret set -n "$PREFIX-intelligence" -g "$RESOURCE_GROUP" \
            --secrets llm-api-key="$LLM_API_KEY" > /dev/null
          az containerapp update -n "$PREFIX-intelligence" -g "$RESOURCE_GROUP" \
            --set-env-vars LLM_API_KEY=secretref:llm-api-key > /dev/null

      - name: Deploy services (migrations run at start-up of the new revision)
        run: |
          az containerapp update -n "$PREFIX-intelligence" -g "$RESOURCE_GROUP" \
            --image "$INTELLIGENCE_IMAGE" --query properties.latestRevisionName -o tsv
          az containerapp update -n "$PREFIX-conversation" -g "$RESOURCE_GROUP" \
            --image "$CONVERSATION_IMAGE" --query properties.latestRevisionName -o tsv

      - name: Health check (waits for cold start and database resume, fails after ~10 min)
        run: |
          for app in intelligence conversation; do
            FQDN=$(az containerapp show -n "$PREFIX-$app" -g "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "$(echo "$app" | tr '[:lower:]' '[:upper:]')_URL=https://$FQDN" >> "$GITHUB_ENV"
            for i in $(seq 1 40); do
              body=$(curl -s --max-time 30 "https://$FQDN/health" || true)
              if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q "$GITHUB_SHA"; then
                echo "$app is healthy on this commit: $body"; break
              fi
              if [ "$i" -eq 40 ]; then echo "::error::$app /health never returned 200 on $GITHUB_SHA"; exit 1; fi
              echo "waiting for $app ($i/40): ${body:-no answer}"; sleep 15
            done
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI with the deployed service URLs
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cat > dist/config.js <<EOF2
          window.NEBULA_CONFIG = {
            conversationApiUrl: "$CONVERSATION_URL",
            intelligenceApiUrl: "$INTELLIGENCE_URL",
          };
          EOF2
          cat dist/config.js

      - name: Get Static Web App deployment token
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list -n "$PREFIX-ui" -g "$RESOURCE_GROUP" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Deploy UI to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      - name: Smoke test against the live URL
        run: |
          UI="https://$(az staticwebapp show -n "$PREFIX-ui" -g "$RESOURCE_GROUP" --query defaultHostname -o tsv)"
          sleep 20
          curl -fsS "$UI/" | grep -q "Nebula Desk"
          curl -fsS "$UI/config.js" | grep -q "$CONVERSATION_URL"
          curl -fsS "$CONVERSATION_URL/health" > /dev/null
          curl -fsS "$INTELLIGENCE_URL/health" > /dev/null
          echo "Live: $UI" >> "$GITHUB_STEP_SUMMARY"
