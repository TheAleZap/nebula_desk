# CI: runs on every pull request and every push to a branch (not main: CD calls it).
# Gates: lint, format check, tests with coverage >= 70% per service, UI build,
# Docker image builds, and the whole stack on a real SQL Server (docker compose).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  placeholders:
    name: No template text left
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a "REPLACE:" marker is still in any Markdown file
        run: |
          if grep -rn --include='*.md' 'REPLACE:' . ; then
            echo "::error::Replace every REPLACE: marker listed above with your own text, then push again."
            exit 1
          fi

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [conversation-api, intelligence-api]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests with coverage (fails below 70%)
        run: pytest
      - name: Dependency security audit
        run: pip-audit -r requirements.txt
        continue-on-error: true # reported, not blocking: a new CVE should not freeze the team

  ui:
    name: Build UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    name: Build image ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [conversation-api, intelligence-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          provenance: false

  compose-smoke:
    name: Compose stack on SQL Server
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start database, migrations and both services
        run: docker compose up -d --build sqlserver db-init conversation-api intelligence-api
      - name: Wait for /health on both services
        run: |
          for port in 8001 8002; do
            for i in $(seq 1 36); do
              if curl -fsS "http://localhost:$port/health"; then echo; break; fi
              if [ "$i" -eq 36 ]; then docker compose logs; exit 1; fi
              sleep 5
            done
          done
      - name: Cross-service flow (Conversation API -> Intelligence API)
        run: curl -fsS -X POST http://localhost:8001/conversations/simulate | grep '"analysis_status":"ok"'
      - name: Partial failure is handled (Intelligence stopped)
        run: |
          docker compose stop intelligence-api
          curl -fsS http://localhost:8001/conversations > /dev/null
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8001/conversations/1/analyze)
          test "$code" = "503"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
